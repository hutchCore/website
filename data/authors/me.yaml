role: "Agent-Based Modeler & Engineering Leader, Moving into Computational Neuroscience"
bio: "Hi, I’m Meghan. My research background is in agent-based modeling: building computer simulations to study complex systems, especially ecology and social influence. After that, I spent 14 years in software engineering, building products and leading teams. Now I’m heading back to research, working toward a PhD in neuroscience and teaching myself the fundamentals along the way. I’m fascinated by how the brain’s mechanisms add up to the way we perceive, learn, and behave. My current focus is on how early experiences produce lasting changes in neural function and behavior, including chronic pain. When I'm not at my desk, you'll find me playing the bagpipes, enjoying nature, or reading the Dungeon Crawler Carl series."

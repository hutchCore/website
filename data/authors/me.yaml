role: "Systems modeler moving into computational neuroscience"
bio: "Hello! I study the brain as a complex adaptive system, focusing on the structures and processes that support learning and memory. I want to understand how neural activity gives rise to behavior and which system properties shape that behavior. My approach is to build minimal, biologically grounded models that test experimental hypotheses and generate testable predictions. In previous research, I built agent-based models of ecological, social-network, and historical land-use systems. I then spent 14 years in software engineering, building products and leading teams, and I’m now returning to full-time research. Outside of work, I play the bagpipes, spend time outdoors, and read the Dungeon Crawler Carl series. I recently returned from a two-month backpacking trip across Ireland, which helped me clear my head before admissions season."
